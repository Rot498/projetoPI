<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Reservas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

  <aside class="sidebar">
    <h2>StreetCar</h2>
    <ul>
  <li onclick="ir('dashboard.html')">📊 Dashboard</li>
  <li onclick="ir('veiculos.html')">🚗Veículos</li>
  <li onclick="ir('clientes.html')">👤 Clientes</li>
  <li onclick="ir('locacoes.html')">📄 Locações</li>
  <li class="active">📅 Reservas</li>
  <li onclick="logout()">🚪 Sair</li>
    </ul>
  </aside>

  <main class="main">

    <div class="topo">
      <h1>Reservas</h1>
      <div id="userName" class="user"></div>
    </div>

    <!-- FORM -->
    <div class="tabela">
      <h2>Nova Reserva</h2>

      <div class="form-locacao">

  <select id="cliente"></select>

  <select id="veiculo"></select>

  <div class="campo-data">
    <label>Início</label>
    <input type="date" id="inicio">
  </div>

  <div class="campo-data">
    <label>Devolução</label>
    <input type="date" id="fim">
  </div>

        <button onclick="salvarReserva()">Reservar</button>
      </div>
    </div>

    <!-- LISTA -->
    <div class="tabela">
      <h2>Reservas</h2>

      <table>
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Veículo</th>
            <th>Início</th>
            <th>Fim</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>

        <tbody id="listaReservas"></tbody>
      </table>
    </div>

  </main>

</div>

<script src="js/script.js"></script>
<script src="js/auth.js"></script>
<script src="js/reservas.js"></script>

<script>
  verificarLogin();
</script>

</body>
</html>
