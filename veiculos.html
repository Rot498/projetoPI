<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Veículos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>StreetCar</h2>
    <ul>
  <li onclick="ir('dashboard.html')">📊 Dashboard</li>
  <li class="active">🚗Veículos</li>
  <li onclick="ir('clientes.html')">👤 Clientes</li>
  <li onclick="ir('locacoes.html')">📄 Locações</li>
  <li onclick="ir('reservas.html')">📅 Reservas</li>
  <li onclick="logout()">🚪 Sair</li>
    </ul>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <div class="topo">
      <h1>Veículos</h1>
      <div id="userName" class="user"></div>
    </div>

    <!-- FORM -->
    <div class="tabela">
      <h2>Cadastrar Veículo</h2>

      <div class="form-veiculo">
  <input type="text" id="modelo" placeholder="Modelo">
  <input type="text" id="placa" placeholder="Placa">
  <input type="number" id="ano" placeholder="Ano">

  <button onclick="salvarVeiculo()">Salvar</button>
</div>
    </div>

    <!-- LISTA -->
    <div class="tabela">
      <h2>Lista de Veículos</h2>

      <table>
        <thead>
          <tr>
            <th>Modelo</th>
            <th>Placa</th>
            <th>Ano</th>
            <th>Ações</th>
          </tr>
        </thead>

        <tbody id="listaVeiculos"></tbody>
      </table>
    </div>

  </main>

</div>

<script src="js/script.js"></script>
<script src="js/auth.js"></script>
<script src="js/veiculos.js"></script>

<script>
  verificarLogin();
</script>

</body>
</html>
