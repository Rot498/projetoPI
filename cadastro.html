<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="center">

<div class="card">
  <h2>Cadastro</h2>

  <input type="text" id="nome" placeholder="Nome completo">

  <button onclick="cadastrar()">Cadastrar</button>
</div>

<script src="js/cadastro.js"></script>
</body>
</html>
